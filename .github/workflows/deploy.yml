name: Deploy

on:
  # on push to the main branch, trigger the deployment workflow
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # copy the code to the ubuntu machine
      - name: Checkout code
        uses: actions/checkout@v4

      # setting up node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # installing dependencies for sst
      - name: Install dependencies
        run: npm ci

      # run tests
      - name: Run tests
        run: npx jest

  deploy:
    runs-on: ubuntu-latest
    needs: test # only runs if tests pass
    steps:
      # copy the code to the ubuntu machine
      - name: Checkout code
        uses: actions/checkout@v4

      # setting up node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # installing dependencies for sst
      - name: Install dependencies
        run: npm ci

      # installing dependencies for web
      - name: Install web dependencies
        run: cd web && npm ci

      # configure AWS credentials using the secrets stored in GitHub (need to be set up in the repository settings)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      # deploy to production
      - name: Deploy
        run: npx sst deploy --stage production
